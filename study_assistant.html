<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کمک‌یار نهم | GPT-5.6</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 8px 30px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:bold;margin-bottom:6px}select,input,textarea{width:100%;padding:12px;border:1px solid #d8deea;border-radius:12px;font:inherit}textarea{min-height:130px;resize:vertical}.full{grid-column:1/-1}button{border:0;border-radius:12px;padding:13px 20px;background:#ff7a00;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}button:disabled{opacity:.6}.status{padding:10px 14px;border-radius:12px;background:#eef2f7;margin-bottom:15px}.answer{white-space:pre-wrap;line-height:2;background:#f8f9fc;padding:16px;border-radius:14px;min-height:80px}.err{color:#b42318}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><h1>🤖 کمک‌یار نهم</h1><div id="status" class="status">در حال بررسی اتصال...</div><div class="grid">
<div><label>درس</label><select id="subject"><option>ریاضی</option><option>علوم</option><option>فارسی</option><option>نگارش</option><option>عربی</option><option>انگلیسی</option><option>مطالعات اجتماعی</option><option>دینی</option></select></div>
<div><label>حالت پاسخ</label><select id="mode"><option value="آموزشی">آموزشی و مرحله‌به‌مرحله</option><option value="کوتاه">کوتاه و مستقیم</option><option value="امتحانی">مثل پاسخ امتحان</option></select></div>
<div><label>کد/نام کتاب</label><input id="book" placeholder="مثلاً ریاضی نهم"></div><div><label>روش تدریس معلم</label><input id="teacher" placeholder="مثلاً ساده و مرحله‌به‌مرحله"></div>
<div class="full"><label>سؤالت</label><textarea id="question" placeholder="سؤالت را اینجا بنویس..."></textarea></div>
<div class="full"><label>عکس سؤال (اختیاری)</label><input id="image" type="file" accept="image/*"></div></div><br><button id="send">ارسال سؤال 🚀</button></div>
<div class="card"><h2>پاسخ</h2><div id="answer" class="answer">هنوز سؤالی ارسال نشده.</div></div></div>
<script>
const API_BASE="";
const $=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(API_BASE+path,options);const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={detail:t}}if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);return d}
async function check(){try{const d=await api("/health");$("status").textContent=`API متصل است ✅ | مدل: ${d.model}`;$("status").className="status"}catch(e){$("status").textContent="API وصل نیست ❌ | اول server.py را اجرا کن";$("status").className="status err"}}
$("send").onclick=async()=>{const q=$("question").value.trim(),file=$("image").files[0];if(!q&&!file){$("answer").textContent="اول سؤال را بنویس یا عکس سؤال را انتخاب کن.";return}$("send").disabled=true;$("answer").textContent="در حال فکر کردن... ⏳";try{let d;if(file){const fd=new FormData();fd.append("user_id","user1");fd.append("question",q);fd.append("subject",$("subject").value);fd.append("mode",$("mode").value);fd.append("book_code",$("book").value);fd.append("image",file);d=await api("/v1/ask-image",{method:"POST",body:fd})}else{d=await api("/v1/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:"user1",question:q,subject:$("subject").value,mode:$("mode").value,book_code:$("book").value})})}$("answer").textContent=d.answer||"پاسخی دریافت نشد."}catch(e){$("answer").textContent="خطا: "+e.message}finally{$("send").disabled=false}};
check();
</script></body></html>
